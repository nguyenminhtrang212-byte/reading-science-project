* { box-sizing: border-box; }

  try { var sv = JSON.parse(localStorage.getItem(KEY) || "null"); if (sv && typeof sv === "object") { S.name = sv.name || ""; S.tick = sv.tick || {}; S.res = sv.res || {}; S.submitted = !!sv.submitted; S.i = sv.i || 0; } } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

  /* ---------- speech ---------- */
  var synth = window.speechSynthesis || null, voices = [], voiceName = "";
  function loadVoices() {
    if (!synth) return;
    voices = synth.getVoices().filter(function (v) { return /^en/i.test(v.lang); });
    var sel = $("#voiceSel"); sel.innerHTML = "";
    if (!voices.length) { sel.innerHTML = "<option>Máy chưa có giọng đọc</option>"; return; }
    voices.sort(function (a, b) { return (/en-GB/i.test(b.lang) ? 1 : 0) - (/en-GB/i.test(a.lang) ? 1 : 0); });
    voices.forEach(function (v) { var o = document.createElement("option"); o.value = v.name; o.textContent = v.name + " (" + v.lang + ")"; sel.appendChild(o); });
    if (!voiceName) voiceName = voices[0].name;
    sel.value = voiceName;
  }
  if (synth) { loadVoices(); synth.onvoiceschanged = loadVoices; }
  $("#voiceSel").addEventListener("change", function (e) { voiceName = e.target.value; });
  function say(t) {
    if (!synth) { alert("Trình duyệt này chưa hỗ trợ đọc mẫu. Em thử mở bằng Chrome hoặc Safari."); return; }
    synth.cancel();
    var u = new SpeechSynthesisUtterance(t); u.lang = "en-GB"; u.rate = 0.82;
    var v = voices.filter(function (x) { return x.name === voiceName; })[0]; if (v) { u.voice = v; u.lang = v.lang; }
    synth.speak(u);
  }

  /* ---------- scenes ---------- */
  var SC = [{ k: "intro", step: 0 }];
  CFG.groups.forEach(function (g, n) { SC.push({ k: "learn", step: 1, g: g, id: "g" + n }); });
  CFG.items.forEach(function (it, n) { SC.push({ k: "q", step: 2, it: it, id: "q" + n, n: n }); });
  SC.push({ k: "end", step: 3 });
  var NQ = CFG.items.length;
  if (S.i >= SC.length || S.i < 0) S.i = 0;

  function solved(id) { var r = S.res[id]; return !!(r && r.done); }
  function canNext() {
    var s = SC[S.i];
    if (s.k === "intro") return S.name.trim().length >= 2;
    if (s.k === "learn") return !!S.tick[s.id];
    if (s.k === "q") return solved(s.id);
    return false;
  }
  function stepReach(st) { // can the chip for step st be opened
    for (var j = 0; j < SC.length; j++) {
      if (SC[j].step === st) return j <= maxOpen();
    }
    return false;
  }
  function maxOpen() {
    var m = 0;
    for (var j = 0; j < SC.length; j++) {
      m = j;
      var s = SC[j], ok = true;
      if (s.k === "intro") ok = S.name.trim().length >= 2;
      else if (s.k === "learn") ok = !!S.tick[s.id];
      else if (s.k === "q") ok = solved(s.id);
      else ok = false;
      if (!ok) break;
    }
    return m;
  }

  function renderSteps() {
    var cur = SC[S.i].step, h = "";
    CFG.steps.forEach(function (nm, st) {
      var cls = "chip" + (st === cur ? " cur" : "") + (st < cur ? " done" : "") + (stepReach(st) ? "" : " lock");
      h += '<button class="' + cls + '" data-st="' + st + '"><span class="n">' + (st < cur ? "✓" : st + 1) + "</span>" + nm + "</button>";
    });
    $("#steps").innerHTML = h;
    Array.prototype.forEach.call(document.querySelectorAll(".chip"), function (b) {
      b.onclick = function () {
        var st = +b.getAttribute("data-st"); if (!stepReach(st)) return;
        for (var j = 0; j < SC.length; j++) if (SC[j].step === st) { S.i = j; break; }
        save(); render();
      };
    });
  }

  function listenBtn(t, big) { return '<button class="spk' + (big ? " big" : "") + '" data-say="' + esc(t) + '" aria-label="Nghe ' + esc(t) + '">🔊</button>'; }
  function bindSay(root) {
    Array.prototype.forEach.call(root.querySelectorAll("[data-say]"), function (b) { b.onclick = function () { say(b.getAttribute("data-say")); }; });
  }

  function sceneIntro() {
    return '<div class="card"><h2>' + CFG.hello + '</h2><p>' + CFG.intro + '</p>' +
      '<p><b>Cách học:</b> (1) nghe và đọc to từng nhóm âm, (2) làm bài luyện, sai thì thử lại, (3) nộp bài cho cô.</p>' +
      '<label for="nm"><b>Em tên là gì?</b></label><br><input class="name" id="nm" autocomplete="name" placeholder="Họ và tên" value="' + esc(S.name) + '"></div>';
  }
  function sceneLearn(s) {
    var g = s.g, h = '<div class="card"><h2>' + g.title + '</h2><div class="muted">' + g.sub + "</div>";
    if (g.cols) {
      h += '<div class="cols" style="margin-top:14px">';
      g.cols.forEach(function (c) {
        h += '<div class="col"><h3>' + c.ipa + "</h3><div class=\"how\">" + c.how + "</div>";
        c.words.forEach(function (w) {
          h += '<div class="w">' + listenBtn(w[0]) + "<b>" + w[0] + '</b><span class="ipa">' + w[1] + '</span><span class="vi">' + w[2] + "</span></div>";
        });
        h += "</div>";
      });
      h += "</div>";
    }
    if (g.rules) {
      g.rules.forEach(function (r) {
        h += '<div class="rule"><div><b>' + r.t + "</b></div>";
        h += '<div class="ex">' + r.ex + "</div>";
        if (r.say) h += '<div style="margin-top:6px">' + r.say.map(function (w) { return listenBtn(w); }).join(" ") + "</div>";
        if (r.n) h += '<div class="muted" style="font-size:15px;margin-top:4px">' + r.n + "</div>";
        h += "</div>";
      });
    }
    if (g.pairs) h += '<div class="pairs"><b>Cặp từ dễ nhầm:</b> ' + g.pairs + "</div>";
    if (g.tip) h += '<div class="tip">' + g.tip + "</div>";
    h += '<label class="tick"><input type="checkbox" id="tk"' + (S.tick[s.id] ? " checked" : "") + '> Em đã nghe và đọc to các từ trên</label></div>';
    return h;
  }
  function qBody(s) {
    var it = s.it, r = S.res[s.id] || { tries: 0, wrong: [] }, done = !!r.done, h = "";
    var tag = { odd: "Chọn từ khác âm", listen: "Nghe và chọn", cls: "Nghe và phân loại", tap: "Bấm âm tiết có trọng âm", sodd: "Chọn từ khác trọng âm" }[it.t];
    h += '<div class="card"><div class="muted">Câu ' + (s.n + 1) + "/" + NQ + " · " + tag + "</div>";
    if (it.t === "odd" || it.t === "sodd") h += "<h2>" + it.p + "</h2>";
    if (it.t === "listen" || it.t === "cls") h += "<h2>" + it.p + "</h2><div>" + listenBtn(it.say, true) + "</div>";
    if (it.t === "tap") h += "<h2>" + it.p + '</h2><div>' + listenBtn(it.say, true) + "</div>";
    if (it.t === "tap") {
      h += '<div class="sylrow">';
      it.syl.forEach(function (sy, j) {
        var c = "syl"; if (r.wrong && r.wrong.indexOf(j) > -1) c += " wrong"; if (done && j === it.a) c += " right";
        h += '<button class="' + c + '" data-o="' + j + '"' + (done || (r.wrong && r.wrong.indexOf(j) > -1) ? " disabled" : "") + ">" + sy + "</button>";
      });
      h += "</div>";
    } else {
      h += '<div class="opts' + (it.o.length === 2 ? " two" : "") + '">';
      it.o.forEach(function (o, j) {
        var c = "opt"; if (r.wrong && r.wrong.indexOf(j) > -1) c += " wrong"; if (done && j === it.a) c += " right";
        var dis = done || (r.wrong && r.wrong.indexOf(j) > -1);
        h += '<button class="' + c + '" data-o="' + j + '"' + (dis ? " disabled" : "") + "><span>" + o + "</span>";
        if (it.t === "odd" || it.t === "sodd") h += '<span class="spk" style="display:inline-grid;place-items:center" data-say="' + esc(strip(o)) + '" role="button" aria-label="Nghe">🔊</span>';
        h += "</button>";
      });
      h += "</div>";
    }
    if (done) {
      h += '<div class="fb ' + (r.shown ? "info" : "ok") + '">' + (r.shown ? "<b>Đáp án:</b> " : "<b>Đúng rồi!</b> ") + it.x + "</div>";
    } else if (r.tries > 0) {
      h += '<div class="fb no"><b>Chưa đúng.</b> ' + (it.hint || "Nghe lại rồi chọn đáp án khác nhé.") + "</div>";
    }
    return h + "</div>";
  }
  function answer(s, val) {
    var it = s.it, r = S.res[s.id] || (S.res[s.id] = { tries: 0, first: null, done: false, shown: false, wrong: [], ans: "" });
    if (r.done) return;
    var ok = (val === it.a);
    r.tries++; if (r.first === null) r.first = ok;
    r.ans = it.t === "tap" ? it.syl[val] : strip(it.o[val]);
    if (ok) r.done = true; else { r.wrong.push(val); if (r.tries >= 2) { r.done = true; r.shown = true; } }
    save(); render();
  }
  function scoreInfo() {
    var ok = 0, total = SC.filter(function (s) { return s.k === "q"; }).length;
    SC.forEach(function (s) { if (s.k === "q") { var r = S.res[s.id]; if (r && r.first && !r.shown) ok++; } });
    return { ok: ok, total: total };
  }
  function sceneEnd() {
    var sc = scoreInfo(), h = '<div class="card"><h2>Nộp bài</h2><p>Em làm đúng ngay lần đầu <b>' + sc.ok + "/" + sc.total + "</b> câu.</p>";
    var miss = [];
    SC.forEach(function (s) { if (s.k === "q") { var r = S.res[s.id]; if (!(r && r.first)) miss.push(s); } });
    if (miss.length) {
      h += "<b>Những câu cần ôn lại:</b><table class=\"res\">";
      miss.forEach(function (s) { h += "<tr><td>Câu " + (s.n + 1) + "</td><td>" + s.it.x + "</td></tr>"; });
      h += "</table>";
    } else h += "<p>Em không sai câu nào. Rất tốt!</p>";
    h += '<div style="margin-top:16px"><button class="btn primary" id="subBtn"' + (S.submitted ? " disabled" : "") + ">" + (S.submitted ? "Đã nộp" : "Nộp bài cho cô") + '</button></div><div id="subMsg">' + (S.submitted ? '<div class="note ok">Đã nộp bài cho cô. Em có thể đóng trang này.</div>' : "") + "</div></div>";
    return h;
  }

  function render() {
    var s = SC[S.i], st = $("#stage");
    st.innerHTML = s.k === "intro" ? sceneIntro() : s.k === "learn" ? sceneLearn(s) : s.k === "q" ? qBody(s) : sceneEnd();
    bindSay(st);
    if (s.k === "intro") { $("#nm").oninput = function (e) { S.name = e.target.value; save(); upd(); }; }
    if (s.k === "learn") { $("#tk").onchange = function (e) { S.tick[s.id] = e.target.checked; save(); upd(); }; }
    if (s.k === "q") {
      Array.prototype.forEach.call(st.querySelectorAll("[data-o]"), function (b) { b.onclick = function () { answer(s, +b.getAttribute("data-o")); }; });
    }
    if (s.k === "end") { var b = $("#subBtn"); if (b) b.onclick = submitAll; }
    renderSteps(); upd();
    window.scrollTo(0, 0);
  }
  function upd() {
    var s = SC[S.i];
    $("#barfill").style.width = Math.round((S.i / (SC.length - 1)) * 100) + "%";
    $("#lbl").textContent = (S.i + 1) + " / " + SC.length;
    $("#back").disabled = S.i === 0;
    var nx = $("#next"); nx.style.visibility = s.k === "end" ? "hidden" : "visible"; nx.disabled = !canNext();
    renderSteps();
  }
  $("#back").onclick = function () { if (S.i > 0) { S.i--; save(); render(); } };
  $("#next").onclick = function () { if (canNext() && S.i < SC.length - 1) { S.i++; save(); render(); } };

  /* ---------- submit ---------- */
  async function post(obj) {
    var body = JSON.stringify(obj), headers = { "Content-Type": "text/plain;charset=utf-8" };
    try {
      var r = await fetch(SCRIPT_URL, { method: "POST", headers: headers, body: body, redirect: "follow" });
      var j = await r.json(); return j && j.ok === true;
    } catch (e) {
      try { await fetch(SCRIPT_URL, { method: "POST", mode: "no-cors", headers: headers, body: body }); return true; } catch (e2) { return false; }
    }
  }
  async function submitAll() {
    var btn = $("#subBtn"), msg = $("#subMsg"); if (S.submitted) return;
    btn.disabled = true; msg.innerHTML = '<div class="note">Đang gửi bài. Em đừng đóng trang nhé.</div>';
    var details = [], sc = scoreInfo();
    SC.forEach(function (s) {
      if (s.k !== "q") return;
      var r = S.res[s.id] || {}, it = s.it;
      var correct = it.t === "tap" ? it.syl[it.a] : strip(it.o[it.a]);
      details.push({ part: it.g, question: strip(it.p) + (it.say ? " [" + it.say + "]" : ""), answer: r.ans || "", correct: correct, result: (r.first && !r.shown ? "✅ Đúng lần đầu" : "❌ Sai lần đầu") + (r.tries > 1 ? " (" + r.tries + " lượt chọn)" : "") + (r.shown ? ", đã xem đáp án" : "") });
    });
    var ok = await post({ type: "submit", name: S.name.trim(), lesson: LESSON, summary: { recordings: 0, avg: null, full: null, writes: "Pronunciation", quiz: sc.ok + "/" + sc.total }, details: details });
    if (!ok) { msg.innerHTML = '<div class="note err">Chưa gửi được. Em kiểm tra mạng rồi bấm lại nhé.</div>'; btn.disabled = false; return; }
    S.submitted = true; save();
    btn.textContent = "Đã nộp";
    msg.innerHTML = '<div class="note ok">Đã nộp bài cho cô. Em làm tốt lắm! Em có thể đóng trang này.</div>';
  }

  render();
})();
</script>
</body>
</html>
