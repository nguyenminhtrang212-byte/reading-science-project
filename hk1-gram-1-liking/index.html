<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grammar 1: nói về sở thích – V-ing hay to V?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Lexend:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f2f5f9; --surface: #ffffff; --ink: #14202e; --muted: #55667a; --line: #d9e1ea;
  --accent: #0e7a70; --accent-ink: #ffffff; --soft: #eef7f5;
  --bad: #b8400d; --good: #11713b; --badbg: #fbe9e1; --goodbg: #e2f4e8; --warm: #fff6dc; --warmline: #e8c96a;
  --font-display: "Fraunces", Georgia, "Times New Roman", serif;
  --font-body: "Lexend", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1620; --surface: #162130; --ink: #e8eef6; --muted: #9db0c6; --line: #2a3a50;
    --accent: #4fd1c5; --accent-ink: #06201d; --soft: #12303a;
    --bad: #ff9a66; --good: #6fe0a0; --badbg: #3a2418; --goodbg: #14301f; --warm: #33290f; --warmline: #6b5a14; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.65; padding-bottom: 130px; }
button, select, input { font: inherit; color: inherit; }
.wrap { max-width: 860px; margin: 0 auto; padding: 0 16px; }
header.top { padding: 18px 0 8px; }
.kicker-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; }
.kicker { font-size: 13px; font-weight: 500; color: var(--muted); letter-spacing: .02em; }
.voice { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.voice select { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 6px 10px; min-height: 40px; max-width: 220px; font-size: 14px; }
h1 { font-family: var(--font-display); font-size: clamp(24px, 5vw, 34px); line-height: 1.15; margin: 6px 0 12px; text-wrap: balance; }
.steps { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 13.5px; display: inline-flex; gap: 6px; align-items: center; min-height: 34px; cursor: pointer; }
.chip .n { display: inline-grid; place-items: center; width: 19px; height: 19px; border-radius: 50%; background: var(--line); font-size: 11.5px; font-weight: 600; }
.chip.cur { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.chip.cur .n { background: var(--accent); color: var(--accent-ink); }
.chip.done .n { background: var(--good); color: #fff; }
.chip.lock { opacity: .55; cursor: not-allowed; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 18px; min-height: 46px; font-weight: 500; cursor: pointer; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 22px; margin: 14px 0; }
.card h2 { font-family: var(--font-display); font-size: 24px; line-height: 1.25; margin: 4px 0 8px; }
.card h3 { font-size: 18px; margin: 18px 0 6px; color: var(--accent); }
.muted { color: var(--muted); }
.badge { display: inline-block; font-size: 12.5px; font-weight: 600; letter-spacing: .03em; padding: 3px 10px; border-radius: 999px; background: var(--soft); color: var(--accent); border: 1px solid var(--line); }
.teacher { display: flex; gap: 12px; align-items: flex-start; background: var(--warm); border: 1px solid var(--warmline); border-radius: 16px; padding: 12px 14px; margin: 12px 0; }
.teacher .av { flex: none; width: 38px; height: 38px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 600; font-size: 14px; }
.teacher .tx { font-size: 16.5px; }
.formula { background: var(--soft); border-left: 4px solid var(--accent); border-radius: 0 12px 12px 0; padding: 10px 14px; margin: 10px 0; font-weight: 600; font-size: 18px; }
.ex { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
.ex .t { font-size: 18px; }
.ex b { color: var(--accent); }
.spk { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--accent); background: var(--surface); color: var(--accent); font-size: 17px; cursor: pointer; flex: none; }
.spk.big { width: 58px; height: 58px; font-size: 24px; background: var(--accent); color: var(--accent-ink); }
table.t { width: 100%; border-collapse: collapse; font-size: 16px; margin: 8px 0; }
table.t th, table.t td { border: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
table.t th { background: var(--soft); }
table.m td:nth-child(1) { color: var(--bad); }
table.m td:nth-child(2) { color: var(--good); font-weight: 600; }
.opts { display: grid; gap: 10px; margin-top: 14px; }
.opts.two { grid-template-columns: 1fr 1fr; }
@media (max-width: 520px) { .opts.two { grid-template-columns: 1fr; } }
.opt { display: flex; align-items: center; justify-content: space-between; gap: 8px; border: 2px solid var(--line); background: var(--surface); border-radius: 14px; padding: 12px 16px; min-height: 54px; text-align: left; cursor: pointer; font-size: 18px; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt.right { border-color: var(--good); background: var(--goodbg); }
.opt.wrong { border-color: var(--bad); background: var(--badbg); opacity: .8; }
.opt:disabled { cursor: default; }
.q { font-size: 20px; line-height: 1.55; margin: 6px 0 4px; }
.q .sentence { font-size: 20px; }
.fillrow { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
input.ans { flex: 1; min-width: 200px; border: 2px solid var(--line); border-radius: 12px; padding: 10px 14px; min-height: 50px; font-size: 18px; background: var(--surface); }
input.ans:disabled { opacity: .8; }
input.ans.right { border-color: var(--good); background: var(--goodbg); }
.fb { margin-top: 14px; padding: 12px 16px; border-radius: 12px; font-size: 16.5px; }
.fb.ok { background: var(--goodbg); border: 1px solid var(--good); }
.fb.no { background: var(--badbg); border: 1px solid var(--bad); }
.fb.info { background: var(--soft); border: 1px solid var(--line); }
.tick { display: flex; gap: 10px; align-items: center; margin-top: 16px; font-size: 16px; cursor: pointer; }
.tick input { width: 22px; height: 22px; accent-color: var(--accent); }
input.name { width: 100%; max-width: 380px; border: 2px solid var(--line); border-radius: 12px; padding: 10px 14px; min-height: 48px; background: var(--surface); }
.dock { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding: 10px 0 14px; }
.dock .wrap { display: grid; gap: 8px; }
.bar { height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); transition: width .25s; }
.dockrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.dockrow .lbl { font-size: 14px; color: var(--muted); text-align: center; flex: 1; }
.note { margin-top: 12px; padding: 10px 14px; border-radius: 12px; background: var(--soft); border: 1px solid var(--line); }
.note.ok { background: var(--goodbg); border-color: var(--good); }
.note.err { background: var(--badbg); border-color: var(--bad); }
.stage { min-height: 300px; }
table.res { width: 100%; border-collapse: collapse; font-size: 15px; margin-top: 10px; }
table.res td, table.res th { border-top: 1px solid var(--line); padding: 8px 6px; text-align: left; vertical-align: top; }
</style>
</head>

</div>

</div>
<script>
(function () {
  "use strict";
  var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwnf8X3_Xfk9F_8HQtBwSFU_s28sRjxKb0aFaHCA4ybmMJvgaztBAbdvaFzITdbVXBt/exec";
  var CFG = {"id": "g1-liking", "lesson": "HK1 Grammar 1 - so thich V-ing to V", "kicker": "Ôn thi HK1 · Ngữ pháp lớp 8 · Link 1/4", "hello": "Chào em, hôm nay mình học cách nói về sở thích", "intro": "<p>Bài này đi theo một đường thẳng: cô hỏi lại vài điều em đã học ở lớp 6–7, rồi cô giảng bài mới, em luyện cùng cô, cô chỉ ra những lỗi hay gặp, cuối cùng là phần thử thách giống đề thi.</p><p>Em cứ đi chậm, sai thì thử lại, cô luôn có lời giải thích cho em.</p>", "steps": ["Mở đầu", "Ôn lại", "Bài mới", "Luyện cùng cô", "Bẫy cần tránh", "Thử thách", "Nộp bài"], "scenes": [{"k": "intro", "step": 0}, {"k": "teach", "step": 1, "title": "Khởi động: cô hỏi em vài câu cũ", "html": "<div class=\"teacher\"><div class=\"av\">Cô</div><div class=\"tx\">Trước khi học bài mới, cô muốn xem trí nhớ của em còn giữ được những gì từ lớp 6 và 7. Em đừng lo nếu quên, cô nhắc lại ngay sau mỗi câu. Chúng ta sẽ lấy những gì em đã biết làm nền để xây thêm nhé.</div></div><p>Sắp tới em sẽ gặp 5 câu rất ngắn: chia động từ với <b>like</b>, cách thêm <b>-ing</b>, và thứ đứng sau <b>like</b>.</p>", "badge": "Ôn lại", "tickText": "Em đã sẵn sàng"}, {"k": "q", "step": 1, "stage": "Ôn lại", "it": {"t": "mc", "p": "She ____ swimming at the weekend.", "o": ["like", "likes", "liking", "to like"], "a": 1, "x": "Chủ ngữ <b>she</b> là ngôi thứ ba số ít, nên động từ ở hiện tại đơn phải thêm <b>-s</b>: <b>likes</b>. Cô thấy nhiều bạn quên -s ở chỗ này lắm.", "hint": "Nhìn chủ ngữ: she, he, it thì động từ thêm s hoặc es."}, "lead": ""}, {"k": "q", "step": 1, "stage": "Ôn lại", "it": {"t": "fill", "p": "My friends ____ (love) music.", "acc": ["love"], "x": "<b>My friends</b> là số nhiều nên động từ giữ nguyên, không thêm -s: <b>love</b>.", "hint": "Chủ ngữ số nhiều thì động từ không thêm s."}, "lead": ""}, {"k": "q", "step": 1, "stage": "Ôn lại", "it": {"t": "mc", "p": "Thêm -ing vào <b>swim</b> ta được:", "o": ["swiming", "swimming", "swimmming", "swimeing"], "a": 1, "x": "Động từ ngắn có dạng phụ âm - nguyên âm - phụ âm thì gấp đôi phụ âm cuối: swim → <b>swimming</b>, run → running, sit → sitting.", "hint": "Từ ngắn một vần, kết thúc phụ âm đơn thì gấp đôi chữ cuối."}, "lead": ""}, {"k": "q", "step": 1, "stage": "Ôn lại", "it": {"t": "fill", "p": "make → ____ (thêm -ing)", "acc": ["making"], "x": "Động từ tận cùng bằng <b>e</b> thì bỏ e rồi thêm -ing: make → <b>making</b>, dance → dancing, write → writing.", "hint": "Bỏ chữ e cuối rồi thêm ing."}, "lead": ""}, {"k": "q", "step": 1, "stage": "Ôn lại", "it": {"t": "mc", "p": "I like ____.", "o": ["music", "very", "because", "quickly"], "a": 0, "x": "Sau <b>like</b> em đã biết đặt một <b>danh từ</b> (music, pizza, football). Hôm nay cô sẽ cho em thêm một lựa chọn nữa: <b>V-ing</b> và <b>to V</b>.", "hint": "Sau like cần một danh từ, không phải trạng từ hay liên từ."}, "lead": ""}, {"k": "teach", "step": 2, "title": "Cô giảng: nói về sở thích bằng V-ing hoặc to V", "html": "<div class=\"teacher\"><div class=\"av\">Cô</div><div class=\"tx\">Em nhớ câu <i>I like music.</i> chứ? Bây giờ em muốn nói mình thích <b>làm gì đó</b> chứ không chỉ thích một thứ. Em chỉ cần đổi động từ thành dạng <b>V-ing</b>, giống như <b>swimming</b>, <b>making</b> ở phần ôn.</div></div><div class=\"formula\">S + like / love / enjoy ... + <b>V-ing</b></div><div class=\"ex\"><span class=\"t\">She <b>enjoys</b> <b>reading</b> comics.</span> <button class=\"spk\" data-say=\"She enjoys reading comics.\" aria-label=\"Nghe\">🔊</button></div><div class=\"ex\"><span class=\"t\">My brothers <b>love</b> <b>playing</b> football.</span> <button class=\"spk\" data-say=\"My brothers love playing football.\" aria-label=\"Nghe\">🔊</button></div><h3>Hai nhóm động từ em cần phân biệt</h3><table class=\"t \"><tr><th>Nhóm</th><th>Động từ</th><th>Đứng sau</th></tr><tr><td>A: chỉ đi với V-ing</td><td>enjoy, mind, dislike, detest, can't stand</td><td>V-ing</td></tr><tr><td>B: đi được với cả hai</td><td>like, love, hate, prefer</td><td>V-ing <b>hoặc</b> to V (nghĩa gần như nhau)</td></tr></table><div class=\"ex\"><span class=\"t\">I <b>hate</b> <b>waiting</b> / <b>to wait</b> for the bus.</span> <button class=\"spk\" data-say=\"I hate waiting / to wait for the bus.\" aria-label=\"Nghe\">🔊</button></div><div class=\"teacher\"><div class=\"av\">Cô</div><div class=\"tx\">Cô khuyên em: nếu chưa chắc thì cứ dùng <b>V-ing</b>, vì V-ing đúng với <b>mọi</b> động từ chỉ sở thích. Chỉ riêng <b>enjoy</b> thì tuyệt đối không dùng to V nhé.</div></div>", "badge": "", "tickText": "Em đã đọc và hiểu"}, {"k": "teach", "step": 2, "title": "Cô giảng: be keen on, be fond of và 'giới từ + V-ing'", "html": "<div class=\"teacher\"><div class=\"av\">Cô</div><div class=\"tx\">Trong đề em hay gặp các cụm <b>be keen on</b>, <b>be fond of</b>, <b>be interested in</b>. Điểm chung là chúng đều kết thúc bằng một <b>giới từ</b> (on, of, in). Cô có một quy tắc rất dễ nhớ nhé.</div></div><div class=\"formula\">Giới từ + <b>V-ing</b> (không bao giờ to V)</div><div class=\"ex\"><span class=\"t\">Young students are <b>fond of</b> <b>using</b> tablets.</span> <button class=\"spk\" data-say=\"Young students are fond of using tablets.\" aria-label=\"Nghe\">🔊</button></div><div class=\"ex\"><span class=\"t\">She is <b>keen on</b> <b>cooking</b>.</span> <button class=\"spk\" data-say=\"She is keen on cooking.\" aria-label=\"Nghe\">🔊</button></div><div class=\"ex\"><span class=\"t\">We are <b>interested in</b> <b>learning</b> English.</span> <button class=\"spk\" data-say=\"We are interested in learning English.\" aria-label=\"Nghe\">🔊</button></div><h3>Một cụm khó: look forward to</h3><div class=\"teacher\"><div class=\"av\">Cô</div><div class=\"tx\">Chữ <b>to</b> trong <b>look forward to</b> <b>không phải</b> là to của động từ nguyên mẫu, mà là giới từ. Em thử thay bằng danh từ: <i>look forward to the trip</i>. Vì vậy sau nó là <b>V-ing</b>.</div></div><div class=\"ex\"><span class=\"t\">I <b>look forward to</b> <b>seeing</b> you soon.</span> <button class=\"spk\" data-say=\"I look forward to seeing you soon.\" aria-label=\"Nghe\">🔊</button></div><h3>Hai mẫu hay vào đề nữa</h3><div class=\"formula\">spend + thời gian + <b>V-ing</b></div><div class=\"ex\"><span class=\"t\">He spends two hours <b>practising</b> English every day.</span> <button class=\"spk\" data-say=\"He spends two hours practising English every day.\" aria-label=\"Nghe\">🔊</button></div><div class=\"formula\">It's + adj + <b>to V</b></div><div class=\"ex\"><span class=\"t\">It's great <b>to use</b> a tablet for studying.</span> <button class=\"spk\" data-say=\"It's great to use a tablet for studying.\" aria-label=\"Nghe\">🔊</button></div>", "badge": "", "tickText": "Em đã đọc và hiểu"}, {"k": "teach", "step": 2, "title": "Cô nhắc: cách viết lại câu với các cụm sở thích", "html": "<div class=\"teacher\"><div class=\"av\">Cô</div><div class=\"tx\">Đề thi hay cho một câu với <b>love</b> hoặc <b>like</b>, rồi yêu cầu viết lại bằng từ gợi ý. Em chỉ cần nhớ ba cụm này, và nhớ giữ nguyên V-ing.</div></div><table class=\"t \"><tr><th>Câu gốc</th><th>Viết lại</th><th>Từ gợi ý</th></tr><tr><td>Some students love riding bicycles.</td><td>Some students <b>are keen on</b> riding bicycles.</td><td>KEEN</td></tr><tr><td>Linh likes cooking.</td><td>Linh <b>is fond of</b> cooking.</td><td>FOND</td></tr><tr><td>They can't wait to see their grandparents.</td><td>They <b>look forward to seeing</b> their grandparents.</td><td>FORWARD</td></tr></table><div class=\"teacher\"><div class=\"av\">Cô</div><div class=\"tx\">Đặc biệt chú ý: <b>be</b> chia theo chủ ngữ (<b>are</b> keen on, <b>is</b> fond of). Phần lớn các bạn mất điểm vì quên chia <b>be</b>.</div></div>", "badge": "", "tickText": "Em đã chép và hiểu ba cụm này"}, {"k": "q", "step": 3, "stage": "Luyện cùng cô", "it": {"t": "mc", "p": "My sister is fond of ____ stories.", "o": ["read", "to read", "reading", "reads"], "a": 2, "x": "<b>fond of</b> kết thúc bằng giới từ <b>of</b>, nên đi với <b>V-ing</b>: reading.", "hint": ""}, "le     var pct = sc.total ? sc.ok / sc.total : 0;
    h += '<div class="teacher"><div class="av">Cô</div><div class="tx">' + (pct >= 0.85 ? "Em làm rất tốt! Kiến thức của em đã vững. Cô tự hào về em." : pct >= 0.6 ? "Em đã nắm được phần lớn rồi. Em xem lại những câu bên dưới, hôm sau làm lại một lần nữa là chắc hẳn nhé." : "Không sao đâu em, sai là cách học nhanh nhất. Em đọc lại phần Bài mới và Bẫy cần tránh, rồi làm lại, cô tin em sẽ tiến bộ.") + "</div></div>";
    var miss = SC.filter(function (s) { if (s.k !== "q") return false; var r = S.res[s.id]; return !(r && r.first); });
    if (miss.length) { h += "<b>Những câu cần ôn lại:</b><table class=\"res\">"; miss.forEach(function (s) { h += "<tr><td>Câu " + s.n + "</td><td>" + strip(s.it.p).slice(0, 90) + "<br>" + s.it.x + "</td></tr>"; }); h += "</table>"; }
    h += '<div style="margin-top:16px"><button class="btn primary" id="subBtn"' + (S.submitted ? " disabled" : "") + ">" + (S.submitted ? "Đã nộp" : "Nộp bài cho cô") + '</button></div><div id="subMsg">' + (S.submitted ? '<div class="note ok">Đã nộp bài cho cô. Em có thể đóng trang này.</div>' : "") + "</div></div>";
    return h;
  }

  function render() {
    var s = SC[S.i], st = $("#stage");
    st.innerHTML = s.k === "intro" ? sceneIntro() : s.k === "teach" ? sceneTeach(s) : s.k === "q" ? qScene(s) : sceneEnd();
    bindSay(st);
    if (s.k === "intro") $("#nm").oninput = function (e) { S.name = e.target.value; save(); upd(); };
    if (s.k === "teach") $("#tk").onchange = function (e) { S.tick[s.id] = e.target.checked; save(); upd(); };
    if (s.k === "q") {
      if (s.it.t === "mc") Array.prototype.forEach.call(st.querySelectorAll("[data-o]"), function (b) { b.onclick = function () { answerMC(s, +b.getAttribute("data-o")); }; });
      else { var a = $("#ans"), c = $("#chk"); c.onclick = function () { answerFill(s, a.value); }; a.onkeydown = function (e) { if (e.key === "Enter") answerFill(s, a.value); }; }
    }
    if (s.k === "end") { var b = $("#subBtn"); if (b) b.onclick = submitAll; }
    renderSteps(); upd(); window.scrollTo(0, 0);
  }
  function upd() {
    var s = SC[S.i];
    $("#barfill").style.width = Math.round((S.i / (SC.length - 1)) * 100) + "%";
    $("#lbl").textContent = (S.i + 1) + " / " + SC.length;
    $("#back").disabled = S.i === 0;
    var nx = $("#next"); nx.style.visibility = s.k === "end" ? "hidden" : "visible"; nx.disabled = !sceneOk(s);
    renderSteps();
  }
  $("#back").onclick = function () { if (S.i > 0) { S.i--; save(); render(); } };
  $("#next").onclick = function () { if (sceneOk(SC[S.i]) && S.i < SC.length - 1) { S.i++; save(); render(); } };

  async function post(obj) {
    var body = JSON.stringify(obj), headers = { "Content-Type": "text/plain;charset=utf-8" };
    try { var r = await fetch(SCRIPT_URL, { method: "POST", headers: headers, body: body, redirect: "follow" }); var j = await r.json(); return j && j.ok === true; }
    catch (e) { try { await fetch(SCRIPT_URL, { method: "POST", mode: "no-cors", headers: headers, body: body }); return true; } catch (e2) { return false; } }
  }
  async function submitAll() {
    var btn = $("#subBtn"), msg = $("#subMsg"); if (S.submitted) return;
    btn.disabled = true; msg.innerHTML = '<div class="note">Đang gửi bài. Em đừng đóng trang nhé.</div>';
    var details = [], sc = scoreInfo();
    SC.forEach(function (s) {
      if (s.k !== "q") return;
      var r = S.res[s.id] || {}, it = s.it, correct = it.t === "mc" ? strip(it.o[it.a]) : it.acc[0];
      details.push({ part: s.stage, question: strip(it.p), answer: r.ans || "", correct: correct, result: (r.first && !r.shown ? "✅ Đúng lần đầu" : "❌ Sai lần đầu") + (r.tries > 1 ? " (" + r.tries + " lượt thử)" : "") + (r.shown ? ", đã xem đáp án" : "") });
    });
    var ok = await post({ type: "submit", name: S.name.trim(), lesson: LESSON, summary: { recordings: 0, avg: null, full: null, writes: "Grammar", quiz: sc.ok + "/" + sc.total }, details: details });
    if (!ok) { msg.innerHTML = '<div class="note err">Chưa gửi được. Em kiểm tra mạng rồi bấm lại nhé.</div>'; btn.disabled = false; return; }
    S.submitted = true; save(); btn.textContent = "Đã nộp";
    msg.innerHTML = '<div class="note ok">Đã nộp bài cho cô. Em làm tốt lắm! Em có thể đóng trang này.</div>';
  }
  render();
})();
</script>
</body>
</html>
