<style>
:root {

}
@media (prefers-color-scheme: dark) {

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.6; padding-bottom: 130px; }

.wrap { max-width: 900px; margin: 0 auto; padding: 0 16px; }

.voice { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }

h1 { font-family: var(--font-display); font-size: clamp(24px, 5vw, 36px); line-height: 1.15; margin: 6px 0 12px; text-wrap: balance; }

.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-size: 14px; display: inline-flex; gap: 6px; align-items: center; min-height: 36px; cursor: pointer; }

.fb.no { background: var(--badbg); border: 1px solid var(--bad); }
.fb.info { background: var(--soft); border: 1px solid var(--line); }

.bar { height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; }

      var r = S.res[s.id] || {}, it = s.it;
      var correct = it.t === "tap" ? it.syl[it.a] : strip(it.o[it.a]);
      details.push({ part: it.g, question: strip(it.p) + (it.say ? " [" + it.say + "]" : ""), answer: r.ans || "", correct: correct, result: (r.first && !r.shown ? "✅ Đúng lần đầu" : "❌ Sai lần đầu") + (r.tries > 1 ? " (" + r.tries + " lượt chọn)" : "") + (r.shown ? ", đã xem đáp án" : "") });
    });
    var ok = await post({ type: "submit", name: S.name.trim(), lesson: LESSON, summary: { recordings: 0, avg: null, full: null, writes: "Pronunciation", quiz: sc.ok + "/" + sc.total }, details: details });
    if (!ok) { msg.innerHTML = '<div class="note err">Chưa gửi được. Em kiểm tra mạng rồi bấm lại nhé.</div>'; btn.disabled = false; return; }
    S.submitted = true; save();
    btn.textContent = "Đã nộp";
    msg.innerHTML = '<div class="note ok">Đã nộp bài cho cô. Em làm tốt lắm! Em có thể đóng trang này.</div>';
  }

  render();
})();
</script>
