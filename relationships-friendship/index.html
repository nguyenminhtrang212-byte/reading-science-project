<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relationships: Friends and Family (Reading, Speaking, Writing)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Lexend:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: a guided lesson that plays one scene at a time. Header with steps, a stage in the middle, a dock with timeline and Back/Next at the bottom. */
:root {
  --bg: #fcf1f5;
  --surface: #ffffff;
  --ink: #2a1620;
  --muted: #6b5560;
  --line: #ecd5de;
  --accent: #c2255c;
  --accent-ink: #ffffff;
  --mark: #ffe27a;
  --mark-ink: #3b2f00;
  --now: #fbd9e5;
  --bad: #b8400d;
  --good: #11713b;
  --red: #d62828;
  --ac: #fff0b3;
  --font-display: "Fraunces", Georgia, "Times New Roman", serif;
  --font-body: "Lexend", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1a0f15; --surface: #26161e; --ink: #f6e8ee; --muted: #c9aab8; --line: #4a2b3a;
    --accent: #ff8fb3; --accent-ink: #3a0a1c; --mark: #6b5a14; --mark-ink: #fff0b3; --now: #5a2339;
    --bad: #ff9a66; --good: #6fe0a0; --red: #ff6b6b; --ac: #4a3d0c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1a0f15; --surface: #26161e; --ink: #f6e8ee; --muted: #c9aab8; --line: #4a2b3a;
  --accent: #ff8fb3; --accent-ink: #3a0a1c; --mark: #6b5a14; --mark-ink: #fff0b3; --now: #5a2339;
  --bad: #ff9a66; --good: #6fe0a0; --red: #ff6b6b; --ac: #4a3d0c; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.6; padding-bottom: 130px; }
button, select, textarea, input { font: inherit; color: inherit; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }

header.top { padding: 18px 0 8px; }
.kicker-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; }
.kicker { font-size: 13px; font-weight: 500; color: var(--muted); letter-spacing: .02em; }
.voice { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.voice select { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 6px 10px; min-height: 40px; max-width: 230px; font-size: 14px; color: var(--ink); }
h1 { font-family: var(--font-display); font-size: clamp(26px, 5vw, 38px); line-height: 1.1; margin: 6px 0 12px; text-wrap: balance; }
.steps { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-size: 14px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; min-height: 36px; }
.chip .n { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--line); font-size: 12px; font-weight: 600; }
.chip.cur { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.chip.cur .n { background: var(--accent); color: var(--accent-ink); }
.chip.done .n { background: var(--good); color: var(--bg); }
.chip.lock { opacity: .55; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); padding: 9px 16px; border-radius: 10px; cursor: pointer; font-size: 15px; font-weight: 500; min-height: 44px; text-decoration: none; color: var(--ink); }
.btn:hover { border-color: var(--accent); }
.btn:focus-visible, .ico:focus-visible, .opt:focus-visible, select:focus-visible, textarea:focus-visible, input:focus-visible, .chip:focus-visible, .vk:focus-visible, .gw:focus-visible, .node:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.recording { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn svg, .ico svg { width: 18px; height: 18px; flex: none; }
.quiet { background: transparent; color: var(--muted); }
.ico { border: 1px solid var(--line); background: transparent; width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; cursor: pointer; color: var(--muted); flex: none; }
.ico:hover { color: var(--accent); border-color: var(--accent); }
.spacer { flex: 1; }
.row-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }

/* stage */
.stage { max-width: 760px; margin: 12px auto 0; padding: 0 16px; }
.stage.wide { max-width: 1120px; }
.scene { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 22px 24px; animation: rise .25s ease both; }
.scene.plain { background: transparent; border: 0; padding: 0; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.s-kicker { font-size: 12px; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: .07em; }
.scene h2 { font-family: var(--font-display); font-size: clamp(24px, 4.5vw, 32px); line-height: 1.15; margin: 4px 0 10px; text-wrap: balance; }
.scene h3 { font-family: var(--font-display); font-size: 21px; margin: 18px 0 6px; }
.lead { font-size: 18px; margin: 0 0 12px; }
.sub { margin: 0 0 12px; color: var(--muted); font-size: 15px; }
.note { margin: 12px 0 0; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-size: 15px; }
.note.ok { border-color: var(--good); }
.note.err { border-color: var(--bad); }
.field { width: 100%; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); padding: 10px 12px; line-height: 1.5; }
textarea.field { resize: vertical; }
.rules { display: grid; gap: 8px; margin: 12px 0; }
.rule { display: grid; grid-template-columns: 150px 1fr; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; align-items: center; }
.rule b { color: var(--accent); }
.rule .eg { color: var(--muted); font-size: 15px; }
.cbox { margin: 12px 0; padding: 14px 16px; border-radius: 14px; background: var(--bg); border: 1px solid var(--line); font-size: 16px; }
.cbox .lab { font-size: 12px; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: .07em; margin-bottom: 4px; }
.cbox p { margin: 0 0 8px; }
.cbox p:last-child { margin: 0; }
.formula { margin: 12px 0; padding: 12px 16px; border-left: 5px solid var(--accent); background: var(--bg); border-radius: 8px; font-size: 17px; line-height: 1.8; }
.pre { border: 2px dashed var(--line); border-radius: 14px; padding: 14px 16px; margin-top: 14px; }
.pen-t { font-size: 12px; font-weight: 600; color: var(--bad); text-transform: uppercase; letter-spacing: .07em; }
.pen-p { margin: 4px 0 10px; font-size: 16px; }
.pre label { display: flex; gap: 10px; align-items: center; font-size: 17px; cursor: pointer; }
.pre input { width: 22px; height: 22px; accent-color: var(--accent); flex: none; }

/* vocabulary */
.chain { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; margin: 8px 0 12px; }
.node { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 4px 12px; font-size: 14px; line-height: 1.4; }
.node.cur { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.node.past { border-color: var(--accent); color: var(--accent); }
.arrow { color: var(--muted); font-size: 14px; }
.chain.big .node { font-size: 17px; padding: 8px 16px; text-align: center; }
.chain.big .node small { display: block; font-size: 13px; opacity: .85; font-weight: 400; }
.vbig { font-family: var(--font-display); font-size: clamp(30px, 7vw, 48px); font-weight: 700; line-height: 1.12; margin: 8px 0 4px; }
.vtop { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.vtag { font-size: 12px; border: 1px solid var(--line); border-radius: 999px; padding: 1px 10px; color: var(--muted); }
.vvi { font-size: 21px; margin-bottom: 8px; }
.vex { margin: 10px 0 0; font-size: 18px; }
.vex small { display: block; color: var(--muted); font-size: 15px; }
.linkto { margin: 12px 0 0; padding: 10px 14px; border-radius: 12px; border: 1px dashed var(--accent); font-size: 16px; }
.uses { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 12px; font-size: 14px; color: var(--muted); }
.uses .pill { border: 1px solid var(--accent); color: var(--accent); }
.dots { display: flex; gap: 3px; flex-wrap: wrap; margin: 0 0 10px; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--accent); }
.try { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.try .field { flex: 1; min-width: 180px; font-size: 20px; }
.reslist { display: grid; gap: 6px; margin-top: 10px; }
.res { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; font-size: 16px; }
.res .ok { color: var(--good); font-weight: 600; }
.res .no { color: var(--bad); font-weight: 600; }
.score { font-family: var(--font-display); font-size: 48px; font-weight: 700; line-height: 1; margin: 4px 0 8px; }
.mapgrid { display: grid; gap: 10px; margin: 12px 0; }
.mapcard { border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; }
.mapcard h4 { margin: 0 0 4px; font-size: 15px; color: var(--accent); }
.mapcard .chain { margin: 4px 0; }

/* quiz cards, prod blocks */
.qcard { border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; background: var(--surface); }
.qhead { display: flex; align-items: center; gap: 8px; }
.num { font-weight: 600; }
.lvl { font-size: 12px; font-weight: 600; border-radius: 999px; padding: 1px 10px; border: 1px solid var(--accent); color: var(--accent); }
.qtext { font-size: 17px; font-weight: 500; margin: 6px 0 0; }
.qvi { color: var(--muted); font-size: 14px; margin: 0 0 8px; }
.opts { display: grid; gap: 8px; margin: 12px 0 4px; }
.opt { text-align: left; border: 2px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 14px; cursor: pointer; font-size: 16px; min-height: 46px; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt.right { border-color: var(--good); background: color-mix(in srgb, var(--good) 14%, transparent); }
.opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, transparent); }
.opt:disabled { cursor: default; color: var(--ink); }
.fb { margin-top: 8px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); font-size: 15px; }
.fb p { margin: 0 0 6px; }
.fb p:last-child { margin: 0; }
.fb.ok { border-color: var(--good); }
.fb.try { border-color: var(--bad); }
.fbmsg { font-weight: 600; }
.prod { margin-top: 14px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--bg); }
.prod-q { margin: 0 0 8px; font-weight: 500; }
.qacts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }

/* reading */
.read-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
@media (min-width: 940px) { .read-grid { grid-template-columns: 1.1fr 1fr; align-items: start; } .q-col { position: sticky; top: 10px; max-height: calc(100vh - 190px); overflow: auto; padding-right: 4px; } }
.toolbar2 { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
.speed { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.speed button { border: 0; background: transparent; padding: 0 12px; min-height: 42px; cursor: pointer; font-size: 14px; }
.speed button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
article.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 4px 20px 16px; }
article.card h3 { font-family: var(--font-display); font-size: 24px; margin: 16px 0 0; }
.para { padding: 12px 0; border-bottom: 1px dashed var(--line); }
.para:last-child { border-bottom: 0; }
.para-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.tag { font-size: 12px; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: .06em; }
.text { font-size: 19px; line-height: 1.95; margin: 0; }
.text.now { background: var(--now); border-radius: 8px; }
.vk { cursor: pointer; border-radius: 6px; padding: 1px 3px; border-bottom: 2px solid color-mix(in srgb, var(--accent) 55%, transparent); }
.vk:hover { background: color-mix(in srgb, var(--accent) 14%, transparent); }
.gw { cursor: pointer; border-radius: 6px; border-bottom: 2px dotted var(--muted); }
.gw:hover { background: color-mix(in srgb, var(--muted) 14%, transparent); }
.conn { font-weight: 600; color: var(--accent); }
mark.ac { background: var(--ac); color: inherit; border-radius: 4px; padding: 0 2px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 14px; color: var(--muted); margin: 6px 0 10px; }

/* speaking */
.qbig { font-family: var(--font-display); font-size: clamp(24px, 5vw, 34px); line-height: 1.2; margin: 6px 0 4px; }
.qvi2 { color: var(--muted); margin: 0 0 12px; }
.cue { margin: 10px 0; padding: 12px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); }
.cue ul { margin: 4px 0 0; padding-left: 20px; }
.kws { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 12px; }
.kw { border: 1px solid var(--accent); border-radius: 12px; padding: 4px 12px; background: var(--bg); cursor: pointer; text-align: left; font-size: 15px; line-height: 1.35; }
.kw small { display: block; color: var(--muted); font-size: 13px; }
.band { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .06em; padding: 2px 10px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); }
.band.low { background: var(--muted); color: var(--surface); }
.sample { margin: 8px 0 12px; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--bg); font-size: 18px; line-height: 1.85; }
.sample p { margin: 0 0 8px; }
.sample p:last-child { margin: 0; }
.ups { display: grid; gap: 8px; margin: 10px 0; }
.up { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 15px; }
.up .a { color: var(--muted); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--bad) 70%, transparent); }
.up .b { font-weight: 600; margin: 2px 0; }
.up .why { color: var(--muted); }
.dsent { border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-top: 10px; }
.dsent.locked { opacity: .45; }
.dhead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.dhead b { flex: 1; }
.dgood { margin-top: 8px; font-size: 17px; }
.recbox { border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; background: var(--bg); margin-top: 14px; }
.rec-top { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; }
.rec-time { font-variant-numeric: tabular-nums; font-weight: 600; min-width: 110px; }
.meter { flex: 1; min-width: 100px; height: 10px; border-radius: 999px; background: var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .08s linear; }
.recbox audio { width: 100%; margin-top: 12px; }
.rmsg { margin: 10px 0 0; }

/* writing */
.ideas { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 12px; }
.idea { border: 1px solid var(--line); border-radius: 10px; padding: 3px 10px; font-size: 14px; background: var(--bg); }
.idea small { color: var(--muted); }
.ofield { margin-bottom: 14px; }
.ofield label { display: block; font-weight: 600; }
.ofield .help { color: var(--muted); font-size: 14px; margin: 0 0 4px; }
.titem { border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-top: 12px; }
.titem .vi { font-size: 17px; margin: 0 0 8px; }
.hints { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 8px; font-size: 14px; }
.hints .h { border: 1px solid var(--accent); color: var(--accent); border-radius: 999px; padding: 1px 10px; }
.hints .h.got { background: var(--accent); color: var(--accent-ink); }
.model { margin-top: 8px; font-size: 17px; line-height: 1.8; }
.essay p { margin: 0 0 12px; font-size: 18px; line-height: 1.85; }
.sum { display: grid; gap: 10px; margin: 12px 0; }
.sumrow { border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
.sumrow h4 { margin: 0 0 4px; font-size: 15px; color: var(--accent); }
.sumrow p { margin: 2px 0; font-size: 15px; overflow-wrap: anywhere; }
.sumrow audio { width: 100%; margin-top: 6px; }
.pill { font-size: 12px; border-radius: 999px; padding: 1px 8px; background: var(--bg); border: 1px solid var(--line); color: var(--muted); }

/* dock */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--bg); border-top: 1px solid var(--line); padding: 10px 0 12px; }
.dock .wrap { display: grid; gap: 10px; }
.timeline { display: flex; gap: 2px; }
.timeline i { flex: 1; min-width: 2px; height: 6px; border-radius: 3px; background: var(--line); }
.timeline i.sp { margin-left: 6px; }
.timeline i.done { background: var(--accent); cursor: pointer; }
.timeline i.cur { background: var(--ink); }
.dock-row { display: flex; align-items: center; gap: 10px; }
.need { flex: 1; font-size: 14px; color: var(--bad); min-height: 20px; }
.pos { font-size: 13px; color: var(--muted); white-space: nowrap; }

/* info sheet */
#sheet { position: fixed; left: 0; right: 0; bottom: 96px; z-index: 20; display: none; padding: 0 12px; pointer-events: none; }
#sheet.show { display: block; }
.sheet-in { pointer-events: auto; max-width: 640px; max-height: 60vh; overflow: auto; margin: 0 auto; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px; box-shadow: 0 12px 40px rgba(10, 20, 35, .28); }
.sheet-top { display: flex; align-items: center; gap: 10px; }
.sheet-word { font-family: var(--font-display); font-size: 26px; font-weight: 700; line-height: 1.2; }
.sheet-mean { font-size: 20px; margin: 8px 0 4px; }
.sheet-note { color: var(--muted); font-size: 15px; margin: 0 0 4px; }
.sheet-acts { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.nospeech .listen { display: none; }
.toast { position: fixed; left: 50%; bottom: 110px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 15px; z-index: 30; display: none; max-width: 90vw; }
@media (max-width: 520px) { .scene { padding: 16px 14px; } .rule { grid-template-columns: 1fr; } .text { font-size: 18px; } .pos { display: none; } .sample { font-size: 17px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="kicker-row">
      <div class="kicker">Reading · Speaking · Writing · IELTS band 6 đến 7</div>
      <label class="voice listen" id="voiceBox" for="voiceSel"><span>Giọng đọc</span><select id="voiceSel"></select></label>
    </div>
    <h1>Relationships: Friends and Family</h1>
    <nav class="steps" id="steps" aria-label="Các phần của bài học"></nav>
  </header>
</div>

<main class="stage" id="stage"></main>

<div class="dock">
  <div class="wrap">
    <div class="timeline" id="timeline" aria-hidden="true"></div>
    <div class="dock-row">
      <button class="btn" id="backBtn" type="button">Quay lại</button>
      <div class="need" id="needMsg" role="status"></div>
      <span class="pos" id="posLbl"></span>
      <button class="btn primary" id="nextBtn" type="button">Tiếp tục</button>
    </div>
  </div>
</div>

<div id="sheet" role="dialog" aria-label="Nghĩa của từ"><div class="sheet-in" id="sheetIn"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
(function () {
  "use strict";

  var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwnf8X3_Xfk9F_8HQtBwSFU_s28sRjxKb0aFaHCA4ybmMJvgaztBAbdvaFzITdbVXBt/exec";
  var LESSON = "Reading-Speaking-Writing - Relationships and Friendship";
  /* =====================================================================
     DATA 1: vocabulary chains, gap-fill, grammar
     Markup used in strings:  {{id|text}} = lesson word (tap for meaning)
                              [[text|nghĩa]] = glossary word
                              @@text@@ = connector phrase
                              ^^text^^ = academic word (Writing model)
     ===================================================================== */

  function mcq(host, key, items, mode, off) {
    off = off || 0;
    items.forEach(function (it, i) {
      var k = key + ":" + i, r = S.mc[k];
      if (!r) r = S.mc[k] = { tries: 0, first: null, done: false, pick: null, wr: [], ord: null };
      if (!r.ord) { var idx = []; for (var j = 0; j < it.opts.length; j++) idx.push(j); r.ord = it.fix ? idx : shuffle(idx); }
      var card = document.createElement("div"); card.className = "qcard";
      card.innerHTML = '<div class="qhead"><span class="num">Câu ' + (off + i + 1) + '</span>' + (it.tag ? '<span class="lvl">' + esc(it.tag) + '</span>' : '') + '</div>' +
        '<p class="qtext">' + rich(it.q) + '</p>' + (it.qvi ? '<p class="qvi">' + esc(it.qvi) + '</p>' : '') + '<div class="opts"></div><div class="fb" hidden></div>';
      var box = $(".opts", card), fb = $(".fb", card), btns = [];
      r.ord.forEach(function (oi) {
        var b = document.createElement("button"); b.type = "button"; b.className = "opt"; b.textContent = it.opts[oi];
        b.addEventListener("click", function () {
          if (r.done) return;
          r.tries++; var ok = (oi === it.ans);
          if (r.tries === 1) { r.first = ok; r.pick = oi; }
          if (mode === "reveal") { r.done = true; } else if (ok) { r.done = true; } else { r.wr.push(oi); }
          saveS(); paint();
        });
        box.appendChild(b); btns.push({ b: b, oi: oi });
      });
      function paint() {
        btns.forEach(function (x) {
          x.b.classList.remove("right", "wrong"); x.b.disabled = false;
          if (r.done) { x.b.disabled = true; if (x.oi === it.ans) x.b.classList.add("right"); else if (mode === "reveal" && x.oi === r.pick) x.b.classList.add("wrong"); }
          else if (r.wr.indexOf(x.oi) >= 0) { x.b.disabled = true; x.b.classList.add("wrong"); }
        });
        fb.hidden = !(r.done || r.wr.length);
        if (r.done) {
          var good = mode === "reveal" ? r.first : true;
          fb.className = "fb " + (good ? "ok" : "try");
          var msg = mode === "reveal" ? (r.first ? "Chính xác!" : "Chưa đúng. Đáp án đúng đã được đánh dấu xanh.") : (r.first ? "Đúng rồi!" : "Đúng rồi! Lần sau em sẽ nhớ.");

        }

      paint();
      host.appendChild(card);
    });
  }

      '<p class="lead">Đây là toàn bộ bài em vừa dịch, ghép lại. Em đọc từ đầu đến cuối một lần để thấy các đoạn nối với nhau thế nào.</p>' +
      '<div class="legend"><span><mark class="ac">Vàng</mark> = từ vựng học thuật</span><span><span class="vk">Gạch chân</span> = từ Mục 1</span></div>' +
      '<div class="sample essay">' + essay + '</div><div class="row-actions"><button type="button" class="btn listen" id="essay-say">' + SPK + ' Nghe cả bài</button></div>' +
      '<div class="cbox"><div class="lab">Con số cô đếm</div><p>Bài có <b>' + total + ' từ</b>, trong đó <b>' + hl + ' từ</b> (khoảng <b>' + pct + '%</b>) là từ vựng học thuật hoặc từ Mục 1. Như vậy bài đạt chỉ tiêu ít nhất 20%.</p></div>' +
      '<div class="cbox"><div class="lab">Những cấu trúc ngữ pháp tinh tế (nhưng không khó)</div>' +
      '<p><b>Mệnh đề quan hệ</b>: peers whom they have never met; a friend you can count on; …, which helps them build confidence.</p>' +
      '<p><b>Nhượng bộ</b>: Although this trend has certain drawbacks, …; although virtual friendships cannot fully replace …</p>' +

    pen(el, "wfinal", "Chép <b>một đoạn em thích nhất</b> của bài mẫu vào vở. Khi chép, em đọc thầm từng cụm và gạch chân các từ tô màu bằng bút đỏ.", "Em đã chép một đoạn vào vở");
  }, need: function () { return needTick("wfinal", "Hãy chép một đoạn vào vở rồi tick vào ô xác nhận."); } });

  /* ---------------- Step 6: submit ---------------- */
  add({ step: 5, title: "Nộp bài", render: function (el) {
    head(el, "Nộp bài", "Em đã hoàn thành! Nộp bài cho cô nhé.");
    var gf = gapFirst(), mg = PM.filter(function (v) { return S.mres[v.id] && S.mres[v.id].first; }).length, lg = LV.filter(function (v) { return S.lres[v.id] && S.lres[v.id].first; }).length;
    var rd = mcFirst("rt", 7) + mcFirst("rm", 4);
    var grQ = 0, grT = 0; GR.forEach(function (g) { grQ += mcFirst("gr:" + g.id, g.mc.length); grT += g.mc.length; });
    var wtr = WR_ITEMS.filter(function (i) { return S.tr[i.id] && S.tr[i.id].first; }).length;
    var sum = '<div class="sum">' +
      '<div class="sumrow"><h4>Học sinh</h4><p id="sumName"></p></div>' +
      '<div class="sumrow"><h4>Phần 1 · Từ vựng</h4><p>Đúng ngay lần đầu: ' + (gf[0] + mg + lg) + '/' + (gf[1] + PM.length + LV.length) + '</p></div>' +
      '<div class="sumrow"><h4>Phần 2 · Reading</h4><p>Đúng ngay lần đầu: ' + rd + '/' + RQ.length + '</p></div>' +

      '<div class="sumrow"><h4>Phần 4 · Speaking</h4><div id="sumSpeak"></div></div>' +

    el.insertAdjacentHTML("beforeend", sum + '<div id="missing"></div><div class="row-actions"><button type="button" class="btn primary" id="subBtn">Nộp bài cho cô</button></div><div id="subMsg" role="status"></div>');

    var missing = SQ.filter(function (q) { return !RECS[q.id].blob; });
    SQ.forEach(function (q) {

      p.textContent = "Part " + q.part + " · Câu " + q.pn + ": " + q.q; d.appendChild(p);
      if (R.url) { var a = document.createElement("audio"); a.controls = true; a.src = R.url; d.appendChild(a); }
      $("#sumSpeak").appendChild(d);

    if (missing.length && !S.submitted) {
      var m = $("#missing"); m.innerHTML = '<div class="note err">Còn ' + missing.length + ' bản ghi âm chưa có (có thể do em đã tải lại trang). Bấm vào từng câu để ghi âm lại, rồi quay lại đây nộp bài:</div><div class="row-actions" id="missBtns"></div>';
      missing.forEach(function (q) {
        var b = document.createElement("button"); b.type = "button"; b.className = "btn"; b.textContent = "Part " + q.part + " · Câu " + q.pn;

  /* ---------- upload helpers (same protocol as the other lessons) ---------- */
  async function toWav(blob) {
    var AC = window.AudioContext || window.webkitAudioContext, OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    var ab = await blob.arrayBuffer();
    var ac = new AC();
    var buf = await new Promise(function (res, rej) { var p = ac.decodeAudioData(ab, res, rej); if (p && p.then) p.then(res, rej); });
    try { ac.close(); } catch (e) {}
    var sr = 16000, len = Math.max(1, Math.ceil(buf.duration * sr));
    var off = new OAC(1, len, sr), src = off.createBufferSource();
    src.buffer = buf; src.connect(off.destination); src.start();
    var out = await new Promise(function (res, rej) { off.oncomplete = function (e) { res(e.renderedBuffer); }; var p = off.startRendering(); if (p && p.then) p.then(res, rej); });
    var f = out.getChannelData(0), n = f.length, view = new DataView(new ArrayBuffer(44 + n * 2));
    function wr(o, s) { for (var i = 0; i < s.length; i++) view.setUint8(o + i, s.charCodeAt(i)); }
    wr(0, "RIFF"); view.setUint32(4, 36 + n * 2, true); wr(8, "WAVE"); wr(12, "fmt "); view.setUint32(16, 16, true);
    view.setUint16(20, 1, true); view.setUint16(22, 1, true); view.setUint32(24, sr, true); view.setUint32(28, sr * 2, true);
    view.setUint16(32, 2, true); view.setUint16(34, 16, true); wr(36, "data"); view.setUint32(40, n * 2, true);
    for (var i = 0; i < n; i++) { var s = Math.max(-1, Math.min(1, f[i])); view.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7FFF, true); }
    return new Blob([view], { type: "audio/wav" });
  }
  function blobToB64(b) { return new Promise(function (res, rej) { var r = new FileReader(); r.onload = function () { res(String(r.result).split(",")[1]); }; r.onerror = rej; r.readAsDataURL(b); }); }
  async function post(obj) {
    var body = JSON.stringify(obj), headers = { "Content-Type": "text/plain;charset=utf-8" };
    try {
      var r = await fetch(SCRIPT_URL, { method: "POST", headers: headers, body: body, redirect: "follow" });
      var j = await r.json(); return j && j.ok === true;
    } catch (e) {
      try { await fetch(SCRIPT_URL, { method: "POST", mode: "no-cors", headers: headers, body: body }); return true; } catch (e2) { return false; }
    }
  }
  function markSubmitted() {
    var b = $("#subBtn"); if (b) { b.disabled = true; b.textContent = "Đã nộp"; }
    var m = $("#subMsg"); if (m) m.innerHTML = '<div class="note ok">Đã nộp bài cho cô. Em làm tốt lắm! Em có thể đóng trang này.</div>';
  }
  function buildDetails() {
    var d = [];
    CHAINS.forEach(function (c) { mcRows("Từ vựng - điền từ (chuỗi " + c.n + ")", "gap:" + c.id, GAPS[c.id]).forEach(function (x) { d.push(x); }); });
    PM.forEach(function (v) { var m = S.mres[v.id] || {}; d.push({ part: "Từ vựng - nghĩa", question: "Nghĩa của: " + v.en, answer: m.ans || "", correct: v.vi, result: (m.first ? "✅ Đúng lần đầu" : "❌ Sai lần đầu") + (m.tries > 1 ? " (" + m.tries + " lần thử)" : "") }); });
    LV.forEach(function (v) { var m = S.lres[v.id] || {}; d.push({ part: "Từ vựng - nghe gõ", question: "Nghe và gõ từ: " + v.lt, answer: m.ans || "", correct: v.lt, result: (m.first ? "✅ Đúng lần đầu" : "❌ Sai lần đầu") + (m.tries > 1 ? " (" + m.tries + " lần thử)" : "") + (m.revealed ? ", đã xem đáp án" : "") }); });
    mcRows("Reading - True/False/Not Given", "rt", RQ.slice(0, 7)).forEach(function (x) { d.push(x); });
    mcRows("Reading - trắc nghiệm", "rm", RQ.slice(7)).forEach(function (x) { d.push(x); });
    GR.forEach(function (g) {
      mcRows("Ngữ pháp - " + g.id, "gr:" + g.id, g.mc).forEach(function (x) { d.push(x); });
      var p = S.pr["gr:" + g.id] || {}; d.push({ part: "Ngữ pháp - câu tự viết", question: plainText(g.prod.prompt), answer: p.text || "", correct: "", result: p.ok ? "✅ Đúng cấu trúc" : "❓ Chưa đạt" });
    });
    PH.forEach(function (g) { var p = S.pr["ph:" + g.id] || {}; d.push({ part: "Speaking - cụm nối ý", question: g.title, answer: p.text || "", correct: "", result: p.ok ? "✅ Có dùng cụm" : "❓ Chưa đạt" }); });
    mcRows("Speaking - chọn cụm", "phtest", PH_TEST).forEach(function (x) { d.push(x); });
    SQ.forEach(function (q) {
      var st = S.cp[q.id] || { t: [], d: [], n: [], rv: [] }, tries = 0, rv = 0;
      q.s7.forEach(function (s, i) { tries += st.n[i] || 0; if (st.rv[i]) rv++; });
      d.push({ part: "Speaking Part " + q.part, question: q.q, answer: (st.t || []).join(" "), correct: q.s7.map(plainText).join(" "), result: "Đã ghi âm " + Math.round(RECS[q.id].dur) + " giây; chép " + q.s7.length + " câu, " + tries + " lần kiểm tra, xem đáp án " + rv + " câu" });
    });
    mcRows("Writing - phân tích đề", "wa", WA).forEach(function (x) { d.push(x); });
    d.push({ part: "Writing - dàn ý", question: "Dàn ý của em", answer: W_OUTLINE.map(function (f) { return f.label + ": " + (S.ol[f.id] || ""); }).join(" | "), correct: "", result: "" });
    WR_ITEMS.forEach(function (it) { var t = S.tr[it.id] || {}; d.push({ part: "Writing - dịch", question: it.vi, answer: t.text || "", correct: plainText(it.model), result: (t.first ? "✅ Đủ từ gợi ý ngay lần đầu" : "❌ Chưa đủ ngay lần đầu") + (t.rv ? ", đã xem đáp án" : "") }); });
    return d;
  }
  async function submitAll() {
    var btn = $("#subBtn"), msg = $("#subMsg");
    if (S.submitted) return;
    btn.disabled = true;
    try {
      for (var i = 0; i < SQ.length; i++) {
        var q = SQ[i], R = RECS[q.id];
        if (!R.blob) throw new Error("missing");
        if (R.sent) continue;
        msg.innerHTML = '<div class="note">Đang gửi bản ghi âm ' + (i + 1) + '/' + SQ.length + '. Em đừng đóng trang nhé.</div>';
        if (!R.wav) { try { R.wav = await toWav(R.blob); } catch (e) { R.wav = R.blob; } }
        var type = R.wav.type || "audio/wav";
        var ext = type === "audio/wav" ? "wav" : (/mp4/.test(type) ? "m4a" : (/ogg/.test(type) ? "ogg" : "webm"));
        var ok = await post({ type: "audio", name: S.name.trim(), lesson: LESSON, file: "speaking-" + q.id + "." + ext, label: "Speaking Part " + q.part + " - câu " + q.pn, score: null, dur: Math.round(R.dur), target: q.q, transcript: (S.cp[q.id] ? S.cp[q.id].t.join(" ") : ""), audio: await blobToB64(R.wav), mime: type });
        if (!ok) throw new Error("audio");
        R.sent = true;
      }
      msg.innerHTML = '<div class="note">Đang gửi bài làm...</div>';
      var gf = gapFirst(), mg = PM.filter(function (v) { return S.mres[v.id] && S.mres[v.id].first; }).length, lg = LV.filter(function (v) { return S.lres[v.id] && S.lres[v.id].first; }).length;
      var okSub = await post({ type: "submit", name: S.name.trim(), lesson: LESSON, summary: { recordings: SQ.length, avg: null, full: null, writes: WR_ITEMS.length + " câu dịch, " + RQ.length + " câu đọc", quiz: (gf[0] + mg + lg) + "/" + (gf[1] + PM.length + LV.length) }, details: buildDetails() });
      if (!okSub) throw new Error("submit");
      S.submitted = true; markSubmitted();
      try { localStorage.removeItem(SKEY); } catch (e) {}
    } catch (e) {
      btn.disabled = false;
      msg.innerHTML = '<div class="note err">Chưa gửi được (mạng yếu hoặc cô chưa mở cổng nhận bài). Em kiểm tra mạng rồi bấm <b>Nộp bài cho cô</b> lại nhé. Bài làm của em vẫn còn đó.</div>';
    }
  }

  /* =====================================================================
     PLAYER: steps, timeline, back / next
     ===================================================================== */
  var stage = $("#stage"), stepsEl = $("#steps"), tl = $("#timeline"), needMsg = $("#needMsg"), nextBtn = $("#nextBtn"), backBtn = $("#backBtn"), posLbl = $("#posLbl");
  function firstOfStep(st) { for (var i = 0; i < SC.length; i++) if (SC[i].step === st) return i; return 0; }
  function leave() { stopAll(); if (activeRec) activeRec.stop(); closeSheet(); }
  function show(i) {
    leave();
    S.idx = i; if (i > S.max) S.max = i;
    var sc = SC[i];
    stage.className = "stage" + (sc.wide ? " wide" : "");
    stage.innerHTML = ""; var el = document.createElement("section"); el.className = "scene" + (sc.plain ? " plain" : ""); stage.appendChild(el);
    sc.render(el);
    needMsg.textContent = "";
    backBtn.disabled = i === 0;
    nextBtn.style.display = i === SC.length - 1 ? "none" : "";
    posLbl.textContent = (i + 1) + " / " + SC.length;
    paintNav(); saveS();
    window.scrollTo({ top: 0 });
  }
  function paintNav() {
    stepsEl.innerHTML = "";
    STEPS.forEach(function (name, st) {
      var b = document.createElement("button"); b.type = "button";
      var cur = SC[S.idx].step === st, reached = firstOfStep(st) <= S.max, done = reached && SC[S.idx].step > st;
      b.className = "chip" + (cur ? " cur" : "") + (done ? " done" : "") + (!reached ? " lock" : "");
      b.innerHTML = '<span class="n">' + (st + 1) + '</span>' + esc(name);
      b.addEventListener("click", function () {
        if (!reached) { needMsg.textContent = "Hãy hoàn thành phần trước để mở phần \"" + name + "\"."; return; }
        show(firstOfStep(st));
      });
      stepsEl.appendChild(b);
    });
    tl.innerHTML = "";
    SC.forEach(function (sc, i) {
      var seg = document.createElement("i");
      seg.className = (i <= S.max && i !== S.idx ? "done " : "") + (i === S.idx ? "cur " : "") + (i > 0 && SC[i - 1].step !== sc.step ? "sp" : "");
      seg.title = sc.title;
      if (i <= S.max && i !== S.idx) seg.addEventListener("click", function () { show(i); });
      tl.appendChild(seg);
    });
  }
  nextBtn.addEventListener("click", function () {
    var msg = SC[S.idx].need();
    if (msg) { needMsg.textContent = msg; return; }
    if (S.idx < SC.length - 1) show(S.idx + 1);
  });
  backBtn.addEventListener("click", function () { if (S.idx > 0) show(S.idx - 1); });
  window.addEventListener("beforeunload", function (e) { if (S.idx > 1 && !S.submitted) { e.preventDefault(); e.returnValue = ""; } });

  if (S.idx >= SC.length) S.idx = 0;
  if (S.max >= SC.length) S.max = SC.length - 1;
  if (/[?&]debug=1/.test(location.search)) window.__L = { SC: SC, S: S, show: show, SQ: SQ, RECS: RECS };
  show(S.idx);
  if (resumed) toast("Đã mở lại chỗ em đang học. Nếu em đã ghi âm trước đó, hãy ghi âm lại nhé vì trình duyệt không giữ âm thanh.");
})();
