<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grammar 3: ghép câu cho hay, hỏi câu cho đúng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Lexend:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f2f5f9; --surface: #ffffff; --ink: #14202e; --muted: #55667a; --line: #d9e1ea;
  --accent: #6b3fc4; --accent-ink: #ffffff; --soft: #f4effb;
  --bad: #b8400d; --good: #11713b; --badbg: #fbe9e1; --goodbg: #e2f4e8; --warm: #fff6dc; --warmline: #e8c96a;
  --font-display: "Fraunces", Georgia, "Times New Roman", serif;
  --font-body: "Lexend", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1620; --surface: #162130; --ink: #e8eef6; --muted: #9db0c6; --line: #2a3a50;
    --accent: #b79cff; --accent-ink: #1c0f3d; --soft: #241a3a;
    --bad: #ff9a66; --good: #6fe0a0; --badbg: #3a2418; --goodbg: #14301f; --warm: #33290f; --warmline: #6b5a14; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.65; padding-bottom: 130px; }
button, select, input { font: inherit; color: inherit; }
.wrap { max-width: 860px; margin: 0 auto; padding: 0 16px; }
header.top { padding: 18px 0 8px; }
.kicker-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; }
.kicker { font-size: 13px; font-weight: 500; color: var(--muted); letter-spacing: .02em; }
.voice { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.voice select { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 6px 10px; min-height: 40px; max-width: 220px; font-size: 14px; }
h1 { font-family: var(--font-display); font-size: clamp(24px, 5vw, 34px); line-height: 1.15; margin: 6px 0 12px; text-wrap: balance; }
.steps { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 13.5px; display: inline-flex; gap: 6px; align-items: center; min-height: 34px; cursor: pointer; }
.chip .n { display: inline-grid; place-items: center; width: 19px; height: 19px; border-radius: 50%; background: var(--line); font-size: 11.5px; font-weight: 600; }
.chip.cur { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.chip.cur .n { background: var(--accent); color: var(--accent-ink); }
.chip.done .n { background: var(--good); color: #fff; }
.chip.lock { opacity: .55; cursor: not-allowed; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 18px; min-height: 46px; font-weight: 500; cursor: pointer; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 22px; margin: 14px 0; }
.card h2 { font-family: var(--font-display); font-size: 24px; line-height: 1.25; margin: 4px 0 8px; }
.card h3 { font-size: 18px; margin: 18px 0 6px; color: var(--accent); }
.muted { color: var(--muted); }
.badge { display: inline-block; font-size: 12.5px; font-weight: 600; letter-spacing: .03em; padding: 3px 10px; border-radius: 999px; background: var(--soft); color: var(--accent); border: 1px solid var(--line); }
.teacher { display: flex; gap: 12px; align-items: flex-start; background: var(--warm); border: 1px solid var(--warmline); border-radius: 16px; padding: 12px 14px; margin: 12px 0; }
.teacher .av { flex: none; width: 38px; height: 38px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 600; font-size: 14px; }
.teacher .tx { font-size: 16.5px; }
.formula { background: var(--soft); border-left: 4px solid var(--accent); border-radius: 0 12px 12px 0; padding: 10px 14px; margin: 10px 0; font-weight: 600; font-size: 18px; }
.ex { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
.ex .t { font-size: 18px; }
.ex b { color: var(--accent); }
.spk { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--accent); background: var(--surface); color: var(--accent); font-size: 17px; cursor: pointer; flex: none; }
.spk.big { width: 58px; height: 58px; font-size: 24px; background: var(--accent); color: var(--accent-ink); }
table.t { width: 100%; border-collapse: collapse; font-size: 16px; margin: 8px 0; }
table.t th, table.t td { border: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
table.t th { background: var(--soft); }
table.m td:nth-child(1) { color: var(--bad); }
table.m td:nth-child(2) { color: var(--good); font-weight: 600; }
.opts { display: grid; gap: 10px; margin-top: 14px; }
.opts.two { grid-template-columns: 1fr 1fr; }
@media (max-width: 520px) { .opts.two { grid-template-columns: 1fr; } }
.opt { display: flex; align-items: center; justify-content: space-between; gap: 8px; border: 2px solid var(--line); background: var(--surface); border-radius: 14px; padding: 12px 16px; min-height: 54px; text-align: left; cursor: pointer; font-size: 18px; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt.right { border-color: var(--good); background: var(--goodbg); }
.opt.wrong { border-color: var(--bad); background: var(--badbg); opacity: .8; }
.opt:disabled { cursor: default; }
.q { font-size: 20px; line-height: 1.55; margin: 6px 0 4px; }
.q .sentence { font-size: 20px; }
.fillrow { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
input.ans { flex: 1; min-width: 200px; border: 2px solid var(--line); border-radius: 12px; padding: 10px 14px; min-height: 50px; font-size: 18px; background: var(--surface); }
input.ans:disabled { opacity: .8; }
input.ans.right { border-color: var(--good); background: var(--goodbg); }
.fb { margin-top: 14px; padding: 12px 16px; border-radius: 12px; font-size: 16.5px; }
.fb.ok { background: var(--goodbg); border: 1px solid var(--good); }
.fb.no { background: var(--badbg); border: 1px solid var(--bad); }
.fb.info { background: var(--soft); border: 1px solid var(--line); }
.tick { display: flex; gap: 10px; align-items: center; margin-top: 16px; font-size: 16px; cursor: pointer; }
.tick input { width: 22px; height: 22px; accent-color: var(--accent); }
input.name { width: 100%; max-width: 380px; border: 2px solid var(--line); border-radius: 12px; padding: 10px 14px; min-height: 48px; background: var(--surface); }
.dock { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding: 10px 0 14px; }
.dock .wrap { display: grid; gap: 8px; }
.bar { height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); transition: width .25s; }
.dockrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.dockrow .lbl { font-size: 14px; color: var(--muted); text-align: center; flex: 1; }
.note { margin-top: 12px; padding: 10px 14px; border-radius: 12px; background: var(--soft); border: 1px solid var(--line); }
.note.ok { background: var(--goodbg); border-color: var(--good); }
.note.err { background: var(--badbg); border-color: var(--bad); }
.stage { min-height: 300px; }
table.res { width: 100%; border-collapse: collapse; font-size: 15px; margin-top: 10px; }
table.res td, table.res th { border-top: 1px solid var(--line); padding: 8px 6px; text-align: left; vertical-align: top; }
</style>
</head>

      <div class="kicker">Ôn thi HK1 · Ngữ pháp lớp 8 · Link 3/4</div>
      <label class="voice">Giọng đọc <select id="voiceSel" aria-label="Chọn giọng đọc"></select></label>

</div>
<div class="dock">

</div>
<script>
(function () {
  "use strict";
  var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwnf8X3_Xfk9F_8HQtBwSFU_s28sRjxKb0aFaHCA4ybmMJvgaztBAbdvaFzITdbVXBt/exec";
  var CFG = {"id": "g3-sentences", "lesson": "HK1 Grammar 3 - cau ghep lien tu cau hoi", "kicker": "Ôn thi HK1 · Ngữ pháp lớp 8 · Link 3/4", "hello": "Chào em, hôm nay mình học nối câu và đặt câu hỏi", "intro": "<p>Em đã biết viết câu và đặt câu hỏi từ lớp 6–7. Hôm nay mình dùng chúng làm nền để học câu ghép, các từ nối, và câu hỏi nâng cao.</p><p>Bài đi theo trình tự: ôn lại, cô giảng, luyện, tìm lỗi sai, thử thách. Em cứ đi chậm và đọc lời giải thích của cô sau mỗi câu nhé.</p>", "steps": ["Mở đầu", "Ôn lại", "Bài mới", "Luyện cùng cô", "Bẫy cần tránh", "Thử thách", "Nộp bài"], "scenes": [{"k": "intro", "step": 0}, {"k": "teach", "step": 1, "title": "Khởi động: câu và câu hỏi ở lớp 6–7", "html": "<div class=\"teacher\"><div class=\"av\">Cô</div><div class=\"tx\">Em đã biết viết câu và đặt câu hỏi từ lớp 6, 7. Hôm nay mình dùng những điều đó làm nền để nối câu cho hay hơn và hỏi cho đúng. Cô hỏi em 5 câu ôn nhé.</div></div><p>Cô sẽ hỏi về câu có đủ ý, các từ nối and, but, so, or, và câu hỏi với do, does.</p>", "badge": "Ôn lại", "tickText": "Em đã sẵn sàng"}, {"k": "q", "step": 1, "stage": "Ôn lại", "it": {"t": "mc", "p": "Câu nào là một câu <b>đủ ý</b> (có chủ ngữ và động từ)?", "o": ["Loves music.", "She loves music.", "Because she loves music.", "Music of her."], "a": 1, "x": "Một câu đơn cần có <b>chủ ngữ + động từ</b>: <b>She loves music.</b> Câu a thiếu chủ ngữ, câu c thiếu ý chính.", "hint": ""}, "lead": ""}, {"k": "q", "step": 1, "stage": "Ôn lại", "it": {"t": "mc", "p": "It was cold, ____ we wore coats.", "o": ["but", "so", "or", "and"], "a": 1, "x": "<b>so</b> chỉ kết quả: trời lạnh <b>nên</b> chúng tôi mặc áo khoác.", "hint": ""}, "lead": ""}, {"k": "q", "step": 1, "stage": "Ôn lại", "it": {"t": "fill", "p": "I like tea ____ I don't like coffee.", "acc": ["but"], "x": "<b>but</b> nối hai ý trái ngược nhau: tôi thích trà nhưng không thích cà phê.", "hint": "Hai ý trái nhau."}, "lead": ""}, {"k": "q", "step": 1, "stage": "Ôn lại", "it": {"t": "mc", "p": "____ you like pizza?", "o": ["Do", "Does", "Are", "Is"], "a": 0, "x": "Chủ ngữ <b>you</b> dùng <b>do</b> để đặt câu hỏi Yes/No ở hiện tại đơn.", "hint": ""}, "lead": ""}, {"k": "q", "step": 1, "stage": "Ôn lại", "it": {"t": "fill", "p": "Where ____ your father work?", "acc": ["does"], "x": "Chủ ngữ <b>your father</b> là ngôi thứ ba số ít nên dùng <b>does</b>. Sau does động từ giữ nguyên: <b>work</b>.", "hint": "Ngôi thứ ba số ít."}, "lead": ""}, {"k": "teach", "step": 2, "title": "Cô giảng: câu đơn và câu ghép", "html": "<div class=\"teacher\"><div class=\"av\">Cô</div><div class=\"tx\">Câu đơn như một viên gạch: có một ý chính. Câu ghép là hai viên gạch được dán lại với nhau bằng một <b>liên từ</b>. Em đã dùng <b>and, but, so, or</b> ở lớp 7, giờ cô gọi tên chính thức cho chúng.</div></div><div class=\"formula\">Câu đơn: S + V (+ O)</div><div class=\"ex\"><span class=\"t\">I like cooking.</span> <button class=\"spk\" data-say=\"I like cooking.\" aria-label=\"Nghe\">🔊</button></div><div class=\"formula\">Câu ghép: câu đơn 1 <b>,</b> liên từ + câu đơn 2</div><div class=\"ex\"><span class=\"t\">I like cooking<b>, but</b> my sister likes painting.</span> <button class=\"spk\" data-say=\"I like cooking, but my sister likes painting.\" aria-label=\"Nghe\">🔊</button></div><table class=\"t \"><tr><th>Liên từ</th><th>Công dụng</th><th>Ví dụ</th></tr><tr><td>and</td><td>thêm ý</td><td>He plays chess, and she plays tennis.</td></tr><tr><td>but, yet</td><td>đối lập</td><td>He was poor, but he was happy.</td></tr><tr><td>so</td><td>kết quả</td><td>It was raining, so we stayed at home.</td></tr><tr><td>or</td><td>lựa chọn</td><td>Hurry up, or we'll be late.</td></tr></table><div class=\"teacher\"><div class=\"av\">Cô</div><div class=\"tx\">Cô nhắc em một điều nhỏ mà quan trọng: trong câu ghép, <b>trước liên từ có dấu phẩy</b>.</div></div>", "badge": "", "tickText": "Em đã đọc và hiểu"}, {"k": "teach", "step": 2, "title": "Cô giảng: because, although và các từ nối câu", "html": "<div class=\"teacher\"><div class=\"av\">Cô</div><div class=\"tx\">Bây giờ em sẽ thấy ba nhóm từ nối rất hay vào đề: lí do, nhượng bộ và nối giữa hai câu. Em nhớ phân biệt xem sau từ đó là <b>cả một câu</b> hay chỉ là <b>một cụm danh từ</b>.</div></div><table class=\"t \"><tr><th>Từ nối</th><th>Đứng trước</th><th>Ví dụ</th></tr><tr><td>because, as</td><td>một mệnh đề (S + V)</td><td>Lang Lieu couldn't buy special food <b>because</b> he was very poor.</td></tr><tr><td>because of, due to</td><td>một cụm danh từ</td><td>We stayed home <b>because of</b> the rain.</td></tr><tr><td>although</td><td>một mệnh đề (nghĩa: mặc dù)</td><td><b>Although</b> he was tired, he finished his homework.</td></tr><tr><td>however, therefore, moreover, otherwise</td><td>đứng đầu câu mới, sau có dấu phẩy</td><td>He studied hard. <b>However</b>, he failed.</td></tr></table><div class=\"teacher\"><div class=\"av\">Cô</div><div class=\"tx\">Mẹo của cô: sau <b>although</b> em <b>không dùng but</b> nữa. Một câu chỉ cần một trong hai: hoặc <i>Although ..., ...</i> hoặc <i>... , but ...</i>.</div></div><h3>Chọn từ nối theo nghĩa</h3><p>Trước hết em hiểu hai ý quan hệ với nhau thế nào (lí do, kết quả, đối lập, thêm ý), sau đó mới chọn từ cho đúng cấu trúc.</p>", "badge": "", "tickText": "Em đã đọc và hiểu"}, {"k": "teach", "step": 2, "title": "Cô giảng: câu hỏi Yes/No và Wh-", "html": "<div class=\"teacher\"><div class=\"av\">Cô</div><div class=\"tx\">Câu hỏi là phần em đã học, cô chỉ bổ sung hai điểm mới: câu hỏi với <b>how often / what is the price of</b> và câu hỏi mà <b>từ để hỏi chính là chủ ngữ</b>.</div></div><table class=\"t \"><tr><th>Loại</th><th>Cấu trúc</th><th>Ví dụ</th></tr><tr><td>Yes/No</td><td>Do / Does / Did / Be / Modal + S + V?</td><td>Does the festival take place every year?</td></tr><tr><td>Wh-</td><td>Wh-word + trợ động từ + S + V?</td><td>How often does the Gong Festival take place?</td></tr><tr><td>Hỏi giá</td><td>What is the price of ...? / How much is ...?</td><td>What is the price of this scarf?</td></tr><tr><td>Wh- là chủ ngữ</td><td>Who / What + V (không mượn trợ động từ)</td><td>Who lives in the stilt house?</td></tr></table><div class=\"ex\"><span class=\"t\">How <b>often</b> do you go to the library?</span> <button class=\"spk\" data-say=\"How often do you go to the library?\" aria-label=\"Nghe\">🔊</button></div><div class=\"ex\"><span class=\"t\"><b>Who</b> lives in the stilt house?</span> <button class=\"spk\" data-say=\"Who lives in the stilt house?\" aria-label=\"Nghe\">🔊</button></div><div class=\"teacher\"><div class=\"av\">Cô</div><div class=\"tx\">Hai lỗi lớn nhất cô hay thấy: thêm <b>s</b> sau does (<i>Where does she lives?</i>) và mượn does khi <b>Who</b> đã là chủ ngữ (<i>Who does live here?</i>).</div></div>", "badge": "", "tickText": "Em đã đọc và hiểu"}, {"k": "q", "step": 3, "stage": "Luyện cùng cô", "it": {"t": "mc", "p": "I wanted to go out, ____ it was raining.", "o": ["but", "so", "or", "because"], "a": 0, "x": "Hai ý đối lập: muốn đi chơi nhưng trời mưa. Dùng <b>but</b>.", "hint": ""}, "lead": ""}, {"k": "q", "step": 3, "stage": "Luyện cùng cô", "it": {"t": "mc", "p": "We stayed at home ____ the heavy rain.", "o": ["because of", "because", "although", "however"], "a": 0, "x": "Sau chỗ trống là một <b>cụm danh từ</b> (the heavy rain) nên dùng <b>because of</b>.", "hint": ""}, "lead": ""}, {"k": "q", "step": 3, "stage": "Luyện cùng cô", "it": {"t": "mc", "p": "____ he was tired, he finished his homework.", "o": ["Because", "Although", "So", "Or"], "a": 1, "x": "Hai ý đối lập (mệt nhưng vẫn làm bài), đứng đầu câu: <b>Although</b>.", "hint": ""}, "lead": ""}, {"k": "q", "step": 3, "stage": "Luyện cùng cô", "it": {"t": "fill", "p": "How ____ does the Gong Festival take place? – Every year.", "acc": ["often"], "x": "<b>How often</b> hỏi về tần suất, trả lời bằng every year, once a week...", "hint": "Hỏi tần suất."}, "lead": ""}, {"k": "q", "step": 3, "stage": "Luyện cùng cô", "it": {"t": "mc", "p": "Who ____ in th : {"t": "fill", "p": "____ does your school start? – At 7.30.", "acc": ["what time", "when"], "x": "<b>What time</b> (hoặc when) hỏi về thời gian bắt đầu.", "hint": "Hỏi giờ."}, "lead": ""}, {"k": "q", "step": 5, "stage": "Thử thách", "it": {"t": "mc", "p": "Hurry up, ____ we'll be late.", "o": ["or", "and", "so", "but"], "a": 0, "x": "<b>or</b> mang nghĩa “nếu không thì”: Nhanh lên, nếu không chúng ta sẽ muộn.", "hint": ""}, "lead": ""}, {"k": "end", "step": 6}]};
  var LESSON = CFG.lesson, KEY = "gram-" + CFG.id;

    if (!voices.length) { sel.innerHTML = "<option>Máy chưa có giọng đọc</option>"; return; }
    voices.sort(function (a, b) { return (/en-GB/i.test(b.lang) ? 1 : 0) - (/en-GB/i.test(a.lang) ? 1 : 0); });
    voices.forEach(function (v) { var o = document.createElement("option"); o.value = v.name; o.textContent = v.name + " (" + v.lang + ")"; sel.appendChild(o); });
    if (!voiceName) voiceName = voices[0].name;
    sel.value = voiceName;
  }
  if (synth) { loadVoices(); synth.onvoiceschanged = loadVoices; }
  $("#voiceSel").addEventListener("change", function (e) { voiceName = e.target.value; });
  function say(t) {

  function bindSay(root) { Array.prototype.forEach.call(root.querySelectorAll("[data-say]"), function (b) { b.onclick = function (ev) { ev.stopPropagation(); say(b.getAttribute("data-say")); }; }); }

  /* scenes */

  function stageStats() {

  function sceneEnd() {

    if (s.k === "intro") $("#nm").oninput = function (e) { S.name = e.target.value; save(); upd(); };
    if (s.k === "teach") $("#tk").onchange = function (e) { S.tick[s.id] = e.target.checked; save(); upd(); };
    if (s.k === "q") {
      if (s.it.t === "mc") Array.prototype.forEach.call(st.querySelectorAll("[data-o]"), function (b) { b.onclick = function () { answerMC(s, +b.getAttribute("data-o")); }; });
      else { var a = $("#ans"), c = $("#chk"); c.onclick = function () { answerFill(s, a.value); }; a.onkeydown = function (e) { if (e.key === "Enter") answerFill(s, a.value); }; }
    }
    if (s.k === "end") { var b = $("#subBtn"); if (b) b.onclick = submitAll; }
    renderSteps(); upd(); window.scrollTo(0, 0);
  }
  function upd() {
    var s = SC[S.i];
    $("#barfill").style.width = Math.round((S.i / (SC.length - 1)) * 100) + "%";
    $("#lbl").textContent = (S.i + 1) + " / " + SC.length;
    $("#back").disabled = S.i === 0;
    var nx = $("#next"); nx.style.visibility = s.k === "end" ? "hidden" : "visible"; nx.disabled = !sceneOk(s);
    renderSteps();
  }
  $("#back").onclick = function () { if (S.i > 0) { S.i--; save(); render(); } };
  $("#next").onclick = function () { if (sceneOk(SC[S.i]) && S.i < SC.length - 1) { S.i++; save(); render(); } };

  async function post(obj) {
    var body = JSON.stringify(obj), headers = { "Content-Type": "text/plain;charset=utf-8" };
    try { var r = await fetch(SCRIPT_URL, { method: "POST", headers: headers, body: body, redirect: "follow" }); var j = await r.json(); return j && j.ok === true; }
    catch (e) { try { await fetch(SCRIPT_URL, { method: "POST", mode: "no-cors", headers: headers, body: body }); return true; } catch (e2) { return false; } }
  }
  async function submitAll() {
    var btn = $("#subBtn"), msg = $("#subMsg"); if (S.submitted) return;
    btn.disabled = true; msg.innerHTML = '<div class="note">Đang gửi bài. Em đừng đóng trang nhé.</div>';
    var details = [], sc = scoreInfo();
    SC.forEach(function (s) {
      if (s.k !== "q") return;
      var r = S.res[s.id] || {}, it = s.it, correct = it.t === "mc" ? strip(it.o[it.a]) : it.acc[0];
      details.push({ part: s.stage, question: strip(it.p), answer: r.ans || "", correct: correct, result: (r.first && !r.shown ? "✅ Đúng lần đầu" : "❌ Sai lần đầu") + (r.tries > 1 ? " (" + r.tries + " lượt thử)" : "") + (r.shown ? ", đã xem đáp án" : "") });
    });
    var ok = await post({ type: "submit", name: S.name.trim(), lesson: LESSON, summary: { recordings: 0, avg: null, full: null, writes: "Grammar", quiz: sc.ok + "/" + sc.total }, details: details });
    if (!ok) { msg.innerHTML = '<div class="note err">Chưa gửi được. Em kiểm tra mạng rồi bấm lại nhé.</div>'; btn.disabled = false; return; }
    S.submitted = true; save(); btn.textContent = "Đã nộp";
    msg.innerHTML = '<div class="note ok">Đã nộp bài cho cô. Em làm tốt lắm! Em có thể đóng trang này.</div>';
  }
  render();
})();
</script>
</body>
</html>
